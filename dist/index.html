    <script>
      // Sahifa render bo'lishidan OLDIN ishlaydi - shunda dark mode
      // tanlangan foydalanuvchida oq fon "chaqnab" ko'rinmaydi (FOUC oldini olish).
      (function () {
        try {
          var stored = localStorage.getItem('mirzohub-ui');
          var theme = stored ? JSON.parse(stored).state.theme : null;
          if (!theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
